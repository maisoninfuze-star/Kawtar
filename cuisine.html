<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuisine — Kawtar · Commandes</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="./assets/brand/kawtar-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css?v=6">
<style>
  body { background: #0f0b08; }
  .kbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; background: #15100d; border-bottom: 1px solid var(--line-strong); }
  .kbar__l { display: flex; align-items: center; gap: 12px; color: var(--cream); }
  .kbar__l b { font-family: var(--serif); font-size: 22px; letter-spacing: .12em; color: var(--gold-lt); }
  .kbar__st { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .kbar__st.live::before { content: "●"; color: #7fd18a; margin-right: 6px; }
  .kbar__st.off::before { content: "●"; color: #e06a5a; margin-right: 6px; }
  .kbar button { padding: 8px 14px; border-radius: 30px; border: 1px solid var(--line-strong); background: transparent; color: var(--taupe-2); font-family: var(--sans); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .kbar button.is-on { background: var(--gold); color: #1c130b; border-color: var(--gold); }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px 20px 60px; align-items: start; }
  .col h2 { margin: 6px 0 12px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; }
  .col h2 span { background: rgba(201,162,75,.15); color: var(--gold-lt); border-radius: 12px; padding: 1px 9px; }
  .card { background: #1d160f; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px; margin-bottom: 12px; color: var(--cream); }
  .card.is-new { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 18px 50px -30px rgba(201,162,75,.6); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(201,162,75,.55); } }
  .card__top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card__no { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--gold-lt); }
  .card__mode { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; }
  .card__mode.pickup { background: rgba(47,107,79,.35); color: #a9dcb5; } .card__mode.delivery { background: rgba(158,43,37,.32); color: #f2b3ab; }
  .card__meta { font-size: 13px; color: var(--taupe); margin: 4px 0 10px; display: flex; justify-content: space-between; }
  .card__age { color: var(--gold-pale); }
  .card__age.late { color: #f0a49c; font-weight: 500; }
  .items { list-style: none; margin: 0; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .items li { display: flex; gap: 10px; font-size: 16px; padding: 3px 0; }
  .items li b { min-width: 26px; color: var(--gold-lt); }
  .items li small { display: block; color: var(--dim); font-style: italic; font-size: 13px; }
  .note { margin: 8px 0 0; padding: 8px 10px; background: rgba(201,162,75,.08); border-radius: 8px; font-size: 14px; color: var(--cream); }
  .note b { color: var(--gold-pale); font-weight: 500; }
  .cust { font-size: 14px; color: var(--taupe); margin: 10px 0 0; line-height: 1.5; }
  .cust a { color: var(--gold-lt); text-decoration: none; }
  .tot { display: flex; justify-content: space-between; margin: 10px 0 0; font-family: var(--serif); font-size: 19px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .acts button { flex: 1; min-width: 90px; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--cream); font-family: var(--sans); font-size: 13px; letter-spacing: .06em; cursor: pointer; }
  .acts .go { background: var(--gold); color: #1c130b; border-color: var(--gold); font-weight: 600; }
  .acts .warn { color: #f0a49c; border-color: rgba(158,43,37,.6); flex: 0 0 auto; }
  .acts button:disabled { opacity: .5; cursor: wait; }
  .prep { display: flex; gap: 6px; margin-top: 10px; }
  .prep button { flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--taupe-2); cursor: pointer; font-family: var(--sans); }
  .prep button.is-on { background: rgba(201,162,75,.2); color: var(--gold-lt); border-color: var(--gold); }
  .uber { margin-top: 8px; font-size: 13px; color: var(--taupe); } .uber a { color: var(--gold-lt); }
  .empty { color: var(--dim); font-size: 14px; padding: 18px 0; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
  .gate { position: fixed; inset: 0; background: #0f0b08; display: grid; place-items: center; z-index: 50; }
  .gate form { text-align: center; }
  .gate h1 { font-family: var(--serif); font-weight: 500; color: var(--cream); margin: 0 0 6px; }
  .gate p { color: var(--dim); margin: 0 0 22px; }
  .gate input { font-size: 30px; letter-spacing: .5em; text-align: center; width: 220px; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.04); color: var(--cream); }
  .gate .bad { color: #f0a49c; margin-top: 10px; }
  .snd { display: none; }
  @media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="gate" data-gate>
  <form data-gate-form>
    <h1>Cuisine Kawtar</h1><p>Entrez le NIP de la cuisine</p>
    <input type="password" inputmode="numeric" autocomplete="one-time-code" data-pin autofocus>
    <p class="bad" data-gate-err hidden>NIP incorrect</p>
  </form>
</div>
<header class="kbar">
  <div class="kbar__l"><b>KAWTAR</b><span class="kbar__st" data-st>connexion…</span></div>
  <div><button data-sound class="is-on">🔔 Son</button> <button data-tab="open" class="is-on">En cours</button> <button data-tab="today">Aujourd’hui</button> <button data-lock>Verrouiller</button></div>
</header>
<main class="board" data-board>
  <section class="col"><h2>Nouvelles <span data-n-new>0</span></h2><div data-col-new></div></section>
  <section class="col"><h2>En préparation <span data-n-prep>0</span></h2><div data-col-prep></div></section>
  <section class="col"><h2>Prêtes / en route <span data-n-ready>0</span></h2><div data-col-ready></div></section>
</main>
<script src="./js/kitchen.js?v=1"></script>
</body>
</html>
